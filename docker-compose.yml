version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupredict-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://edupredict:password@postgres:5432/edupredict
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/app:/app/app
      - ./admission_predict.csv:/app/data/admission_predict.csv
    depends_on:
      - postgres
      - redis
    networks:
      - edupredict-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: edupredict-postgres
    environment:
      - POSTGRES_USER=edupredict
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=edupredict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edupredict-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: edupredict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edupredict-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Next.js Frontend (when implemented)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: edupredict-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000
  #   depends_on:
  #     - backend
  #   networks:
  #     - edupredict-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  edupredict-network:
    driver: bridge
